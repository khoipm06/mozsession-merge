name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Release Artifacts
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            suffix: linux-amd64
            binary_name: mergetabs
          - os: linux
            arch: arm64
            suffix: linux-arm64
            binary_name: mergetabs
          - os: darwin
            arch: amd64
            suffix: darwin-amd64
            binary_name: mergetabs
          - os: darwin
            arch: arm64
            suffix: darwin-arm64
            binary_name: mergetabs
          - os: windows
            arch: amd64
            suffix: windows-amd64.exe
            binary_name: mergetabs.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          go build -trimpath -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o dist/mergetabs-${{ matrix.suffix }} ./cmd/mergetabs

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mergetabs-${{ matrix.suffix }}
          path: dist/mergetabs-${{ matrix.suffix }}

  publish-release:
    name: Create GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate Checksums
        working-directory: release-artifacts
        run: |
          sha256sum * > SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
