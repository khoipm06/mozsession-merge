name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & Test
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.21", "1.22", "1.23"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Verify module
        run: go mod verify

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test (with race detector)
        run: go test -v -race ./...

  cross-compile:
    name: Cross-compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - name: Build linux/amd64
        run: GOOS=linux GOARCH=amd64 go build ./cmd/mergetabs
      - name: Build darwin/amd64
        run: GOOS=darwin GOARCH=amd64 go build ./cmd/mergetabs
      - name: Build darwin/arm64
        run: GOOS=darwin GOARCH=arm64 go build ./cmd/mergetabs
      - name: Build windows/amd64
        run: GOOS=windows GOARCH=amd64 go build ./cmd/mergetabs
